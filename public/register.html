<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Регистрация — FindYourJob</title><link rel="stylesheet" href="/styles.css"><script src="/auth.js" defer></script></head><body class="auth-page"><header class="header"><a href="/" class="brand"><span class="brand-icon">f<span>j</span></span>FindYourJob<span class="brand-dot">.</span></a><a class="nav-link" href="/">← К поиску вакансий</a></header><main class="auth-layout"><section class="auth-intro"><p class="eyebrow">НАЧНИТЕ НОВУЮ ГЛАВУ</p><h1>Больше возможностей.<br><span>Ближе к цели.</span></h1><p>Создайте аккаунт и найдите работу,<br>которая подходит именно вам.</p><div class="auth-symbol" aria-hidden="true">✳</div></section><section class="auth-card"><p class="eyebrow">ПРИСОЕДИНЯЙТЕСЬ</p><h2>Создать аккаунт</h2><p>Первый шаг к вашей следующей работе.</p><form id="auth-form" data-mode="register"><label for="name">Ваше имя</label><input id="name" name="name" autocomplete="name" maxlength="80" placeholder="Как к вам обращаться?" required><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" aria-describedby="password-hint" required><small class="hint" id="password-hint">От 10 до 128 символов</small><div id="auth-error" class="form-error" role="alert"></div><button class="button" type="submit">Зарегистрироваться <span><svg class="arrow-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19 19 5M5 5h14v14"/></svg></span></button></form><p class="auth-switch">Уже есть аккаунт? <a href="/login.html">Войти</a></p></section></main></body></html>
